<div class="mb-3">
	<div class="mb-1" data-v-if-not="this.global.user_id">
	  <div class="form-check form-check-inline">
		  <label class="form-check-label" for="register-account-check">
			 <input class="form-check-input" type="radio" value="true" id="register-account-check" name="register" checked onclick="toggleRegister(this)">
			 <span>Register account</span>
		  </label>
	  </div>
	  
	  <div class="form-check form-check-inline">
		  <label class="form-check-label" for="guest-check">
			 <input class="form-check-input" type="radio" value="false" id="guest-check" name="register" onclick="toggleRegister(this)">
			 <span>Guest checkout</span>
		  </label>
		</div>
	</div>

	<div class="row mb-3 register-account" id="register-account" data-v-if-not="this.global.user_id">
			
		<div class="input-group">
		  <input type="password" minlength="6" autocorrect="off" class="form-control label-over" placeholder=" "  id="register-password" name="password"  value="" aria-label="Password" autocomplete="new-password" required>
  		  <label class="col-form-label" for="register-password">Password</label>
  		  <button class="btn px-3 border border-start-0" type="button" onclick="togglePasswordInput(this,'register-password')"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" /> <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" /> <path d="M3 3l18 18" /></svg></button>
		</div>
	</div>
</div>
