<div class="post-content" data-v-if="post.password">
<span class="card">
	<div class="card-body">
	<form action method="post" enctype="multipart/form-data" data-v-vvveb-on="submit" class="login-form">
		
		<input type="hidden" name="csrf" data-v-csrf>

		@@include('../_includes/notifications.html', {type:"password"})	
			
		<div class="mb-3">
			<label class="form-label" for="post-password">Password</label>
			
			<div class="input-group">
			  <input type="password" minlength="4" autocorrect="off" autocomplete="current-password" class="form-control" placeholder="Password"  id="post-password" name="password"  value="" aria-label="Password" required>
			  <button class="btn btn-sm px-3 border border-start-0" type="button" onclick="togglePasswordInput(this, 'post-password')"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" /> <path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87" /> <path d="M3 3l18 18" /></svg></button>
			</div>
		</div>
		
		<button type="submit" value="Login" class="btn btn-primary py-2 btn-login@@if (typeof btnClass !== "undefined"){ @@btnClass}">
			
			<span class="loading d-none">
				<span class="spinner-border spinner-border-sm align-middle" role="status" aria-hidden="true">
				</span>
				<span>Authenticating</span>...
			</span>

			<span class="button-text">
				View post <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ms-2"  aria-hidden="true"><path d="M5 12l14 0" /> <path d="M13 18l6 -6" /> <path d="M13 6l6 6" /></svg>
			</span>
		
		</button>
	</form>
	</div>
</span>
</div>
