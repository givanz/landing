<div data-v-field-gallery>
  <label class="col-form-label">
    <div>Text</div>
    <span class="form-text"></span>
  </label>
  <div class="col">


	<input type="hidden" data-v-image name="image[image]" id="featured-image-input" value="">
								
	<img data-v-image src="img/placeholder.svg" alt=""
	 id="featured-image-thumb"
	 data-v-placeholder=""
	 data-media-gallery 
	 data-target-input="#featured-image-input"
	 data-target-thumb="#featured-image-thumb" data-type="single"
	 class="img-thumbnail bg-body-tertiary"
	 style="max-width:200px;"
	 >
		

		<div class="py-3">
			<div class="btn-group">
				<button type="button" class="btn btn-outline-secondary btn-icon btn-sm"
					data-media-gallery data-target-input="#featured-image-input"
					data-target-thumb="#featured-image-thumb" data-type="single">
					<svg width="1.33em" height="1.33em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M15 8h.01" /> <path d="M3 6a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12" /> <path d="M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5" /> <path d="M14 14l1 -1c.928 -.893 2.072 -.893 3 0l3 3" /></svg> <span>Set image</span>
				</button>
				<button type="button" class="btn btn-outline-secondary btn-icon btn-sm" onclick="clearMedia()">
					<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M18 6l-12 12" /> <path d="M6 6l12 12" /></svg>
				</button>
			</div>
		</div>



  </div>
</div>
