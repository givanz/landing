<section class="contact-form-13 py-5" aria-label="contact-form-13">
	<div class="container">
		<div class="row g-5">
			<div class="col-lg-5">
				<span class="text-uppercase text-primary fw-bold small">Support ticket</span>
				<h2 class="display-6 fw-bold mt-2">Already a Customer?</h2>
				<p class="lead text-muted">Open a ticket with your order details for the fastest help.</p>
				<ul class="list-unstyled mt-4">
					<li class="d-flex mb-3">
						<svg width="2em" height="2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-3"  aria-hidden="true"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" /></svg>
						<div><strong>Priority queue</strong><div class="text-muted small">Customer tickets answered first, every time.</div></div>
					</li>
					<li class="d-flex mb-3">
						<svg width="2em" height="2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-3"  aria-hidden="true"><path d="M12 8l0 4l2 2" /> <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" /></svg>
						<div><strong>Full history</strong><div class="text-muted small">Every reply saved to your account timeline.</div></div>
					</li>
					<li class="d-flex">
						<svg width="2em" height="2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-3"  aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /> <path d="M9 10l.01 0" /> <path d="M15 10l.01 0" /> <path d="M9.5 15a3.5 3.5 0 0 0 5 0" /></svg>
						<div><strong>96% satisfaction</strong><div class="text-muted small">Measured across 40,000 resolved tickets.</div></div>
					</li>
				</ul>
			</div>
			<div class="col-lg-7">
				<div class="card shadow-sm">
					<div class="card-body p-4 p-lg-5">
						<form action="" method="post" data-v-vvveb-action="submit" data-selector="[data-v-component-plugin-contact-form-form]" data-v-vvveb-on="submit">
							<input type="hidden" name="csrf" data-v-csrf>
							<input type="hidden" name="form-name" value="support-ticket">
							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label" for="contact-13-email">Account email</label>
									<input type="email" id="contact-13-email" name="email" class="form-control" placeholder="jane@company.com" autocomplete="email" required>
								</div>
								<div class="col-md-6">
									<label class="form-label" for="contact-13-order">Order number <span class="text-muted fw-normal">(optional)</span></label>
									<input type="text" id="contact-13-order" name="order_id" class="form-control" placeholder="e.g. #10294" autocomplete="off">
								</div>
								<div class="col-12">
									<label class="form-label" for="contact-13-topic">What is this about?</label>
									<select id="contact-13-topic" name="topic" class="form-select" required>
										<option value="" selected>Choose a topic...</option>
										<option value="order">Order status &amp; shipping</option>
										<option value="returns">Returns &amp; refunds</option>
										<option value="technical">Technical issue</option>
										<option value="billing">Billing question</option>
									</select>
								</div>
								<div class="col-12">
									<label class="form-label" for="contact-13-message">Describe the issue</label>
									<textarea id="contact-13-message" name="message" rows="4" class="form-control" placeholder="What happened, and what did you expect? Include screenshots if you can."></textarea>
								</div>
								<div class="col-12">
									<button type="submit" class="btn btn-primary px-5">Open ticket</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
