<section class="contact-form-11 py-5" aria-label="contact-form-11">
	<div class="container">
		<div class="row justify-content-center mb-5">
			<div class="col-md-7 text-center">
				<h2 class="display-6 fw-bold">Let's Work Together</h2>
				<p class="lead text-muted">Tell us about your project, we reply within one business day.</p>
			</div>
		</div>
		<div class="row g-4 align-items-stretch">
			<div class="col-lg-5">
				<div class="p-4 p-lg-5 bg-dark text-white rounded shadow h-100" data-bs-theme="dark">
					<h3 class="h5 fw-bold">Contact information</h3>
					<p class="text-white-50 small">Prefer email or phone? Reach us directly.</p>
					<ul class="list-unstyled mt-4">
						<li class="d-flex mb-3">
							<svg width="2em" height="2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-3 text-primary"  aria-hidden="true"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" /> <path d="M3 7l9 6l9 -6" /></svg>
							<div><strong class="d-block small">Email us</strong><a href="mailto:hello@example.com" class="text-white text-decoration-none">hello@example.com</a></div>
						</li>
						<li class="d-flex mb-3">
							<svg width="2em" height="2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-3 text-primary"  aria-hidden="true"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2" /></svg>
							<div><strong class="d-block small">Call us</strong><a href="tel:+12125550134" class="text-white text-decoration-none">+1 (212) 555-0134</a></div>
						</li>
						<li class="d-flex">
							<svg width="2em" height="2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-3 text-primary"  aria-hidden="true"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /> <path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0" /></svg>
							<div><strong class="d-block small">Visit us</strong><span class="text-white-50 small">350 Fifth Avenue, New York</span></div>
						</li>
					</ul>
					<div class="d-flex gap-2 mt-4">
						<a href="#" class="btn btn-sm btn-outline-light rounded-circle p-2" aria-label="Twitter"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M22 4.01c-1 .49 -1.98 .689 -3 .99c-1.121 -1.265 -2.783 -1.335 -4.38 -.737s-2.643 2.06 -2.62 3.737v1c-3.245 .083 -6.135 -1.395 -8 -4c0 0 -4.182 7.433 4 11c-1.872 1.247 -3.739 2.088 -6 2c3.308 1.803 6.913 2.423 10.034 1.517c3.58 -1.04 6.522 -3.723 7.651 -7.742a13.84 13.84 0 0 0 .497 -3.753c0 -.249 1.51 -2.772 1.818 -4.013l0 .001" /></svg></a>
						<a href="#" class="btn btn-sm btn-outline-light rounded-circle p-2" aria-label="LinkedIn"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M8 11v5" /> <path d="M8 8v.01" /> <path d="M12 16v-5" /> <path d="M16 16v-3a2 2 0 1 0 -4 0" /> <path d="M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4l0 -10" /></svg></a>
						<a href="#" class="btn btn-sm btn-outline-light rounded-circle p-2" aria-label="Facebook"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  aria-hidden="true"><path d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3" /></svg></a>
					</div>
				</div>
			</div>
			<div class="col-lg-7">
				<div class="card shadow-sm h-100">
					<div class="card-body p-4 p-lg-5">
						<form action="" method="post" data-v-vvveb-action="submit" data-selector="[data-v-component-plugin-contact-form-form]" data-v-vvveb-on="submit">
							<input type="hidden" name="csrf" data-v-csrf>
							<input type="hidden" name="form-name" value="contact-split">
							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label" for="contact-11-name">Full name</label>
									<input type="text" id="contact-11-name" name="name" class="form-control form-control-lg" placeholder="Jane Smith" autocomplete="name" required>
								</div>
								<div class="col-md-6">
									<label class="form-label" for="contact-11-email">Work email</label>
									<input type="email" id="contact-11-email" name="email" class="form-control form-control-lg" placeholder="jane@company.com" autocomplete="email" required>
								</div>
								<div class="col-12">
									<label class="form-label" for="contact-11-subject">Subject</label>
									<input type="text" id="contact-11-subject" name="subject" class="form-control form-control-lg" placeholder="Website redesign project">
								</div>
								<div class="col-12">
									<label class="form-label" for="contact-11-message">Project details</label>
									<textarea id="contact-11-message" name="message" rows="4" class="form-control form-control-lg" placeholder="Timeline, budget range and goals..."></textarea>
								</div>
								<div class="col-12">
									<button type="submit" class="btn btn-primary btn-lg px-5">Send message</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
