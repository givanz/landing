<section class="contact-form-12 py-5 bg-body-tertiary" aria-label="contact-form-12">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-lg-9">
				<div class="card shadow border-0">
					<div class="card-body p-4 p-lg-5">
						<div class="text-center mb-4">
							<span class="badge text-bg-primary mb-2">Free quote</span>
							<h2 class="display-6 fw-bold">Get an Instant Estimate</h2>
							<p class="text-muted mb-0">Answer four quick questions for tailored pricing.</p>
						</div>
						<form action="" method="post" data-v-vvveb-action="submit" data-selector="[data-v-component-plugin-contact-form-form]" data-v-vvveb-on="submit">
							<input type="hidden" name="csrf" data-v-csrf>
							<input type="hidden" name="form-name" value="quote-request">
							<div class="row g-3">
								<div class="col-md-6">
									<label class="form-label" for="contact-12-service">What do you need?</label>
									<select id="contact-12-service" name="service" class="form-select form-select-lg" required>
										<option value="" selected>Choose a service...</option>
										<option value="design">Web design</option>
										<option value="store">Online store</option>
										<option value="seo">SEO &amp; marketing</option>
										<option value="care">Care plan</option>
									</select>
								</div>
								<div class="col-md-6">
									<label class="form-label" for="contact-12-budget">Project budget</label>
									<select id="contact-12-budget" name="budget" class="form-select form-select-lg" required>
										<option value="" selected>Select a range...</option>
										<option value="s">Under $1,000</option>
										<option value="m">$1,000 – $5,000</option>
										<option value="l">$5,000 – $20,000</option>
										<option value="xl">$20,000+</option>
									</select>
								</div>
								<div class="col-md-6">
									<label class="form-label" for="contact-12-name">Full name</label>
									<input type="text" id="contact-12-name" name="name" class="form-control form-control-lg" placeholder="Jane Smith" autocomplete="name" required>
								</div>
								<div class="col-md-6">
									<label class="form-label" for="contact-12-email">Email address</label>
									<input type="email" id="contact-12-email" name="email" class="form-control form-control-lg" placeholder="jane@company.com" autocomplete="email" required>
								</div>
								<div class="col-12">
									<span class="form-label d-block">When should we start?</span>
									<div class="d-flex gap-2 flex-wrap" role="group" aria-label="Preferred start">
										<input type="radio" class="btn-check" name="timeline" id="contact-12-t1" value="asap" checked>
										<label class="btn btn-outline-primary" for="contact-12-t1">ASAP</label>
										<input type="radio" class="btn-check" name="timeline" id="contact-12-t2" value="month">
										<label class="btn btn-outline-primary" for="contact-12-t2">This month</label>
										<input type="radio" class="btn-check" name="timeline" id="contact-12-t3" value="quarter">
										<label class="btn btn-outline-primary" for="contact-12-t3">This quarter</label>
									</div>
								</div>
								<div class="col-12 text-center mt-2">
									<button type="submit" class="btn btn-primary btn-lg px-5">Request my estimate</button>
									<p class="small text-muted mt-2 mb-0">Average response time: under 4 hours.</p>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
