<section class="products-3 py-5 bg-body-tertiary" aria-label="products-3">
	<div class="container">
		<div class="row align-items-end mb-4">
			<div class="col-md-8">
				<h2 class="display-6 fw-bold mb-1">New arrivals</h2>
				<p class="text-muted mb-0">Fresh stock, updated weekly.</p>
			</div>
			<div class="col-md-4 text-md-end">
				<a href="product/index.html" class="btn btn-outline-primary">Shop all</a>
			</div>
		</div>
	</div>

	<div class="container"
		data-v-component-products="new"
		data-v-limit="6"
		data-v-variant_price="true"
		data-v-image_size="medium"
	>
		<div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-3">
			@@for (var i = 0; i < 6; i++) {

			<div class="col" data-v-product>
				<div class="card h-100 shadow-sm text-center">
					<a href="product/product.html" data-v-product-url>
						<img src="demo/img/product.webp" loading="lazy" alt="New product" class="card-img-top" data-v-size="thumb" data-v-if="prod.image" data-v-product-image>
						<img src="/media/placeholder.svg" class="card-img-top bg-body-tertiary" loading="lazy" alt="" data-v-if-not="prod.image">
					</a>
					<div class="card-body p-2">
						<a href="product/product.html" class="text-body text-decoration-none small fw-bold" data-v-product-url>
							<span data-v-product-name>Product 8</span>
						</a>
						<p class="product-price text-primary fw-bold small mb-0" data-v-if="prod.price > 0" data-v-product-price_tax_formatted>$100.00</p>
					</div>
				</div>
			</div>

			}
		</div>
	</div>
</section>
